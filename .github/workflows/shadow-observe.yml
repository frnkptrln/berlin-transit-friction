name: accessibility shadow observation

# The rehearsal period (docs/decisions/0002-shadow-period.md). Every quarter
# hour the runner observes the source once into its shadow tree and publishes
# nothing. README.md keeps scheduled publication disabled until every gate is
# met; gate 5 needs exactly this reviewed period first. The shadow tree lives
# in an evictable Actions cache; its sealed days are copied to the
# shadow-ledger branch once a day by the seal workflow, and a cold runner
# restores its state from that branch.

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      seal:
        description: "also seal closed days and rebuild aggregates"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Sealing must never overlap a collection run that could still be appending
  # to the day being sealed; the seal workflow shares this group.
  group: accessibility-shadow
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install -r requirements.txt

      - name: Restore shadow tree
        uses: actions/cache/restore@v4
        with:
          path: .shadow
          key: shadow-tree-${{ github.run_id }}
          restore-keys: shadow-tree-

      # A cold runner (first run, evicted cache) folds the ledger's sealed
      # days instead of starting from nothing. The unsealed day and pending
      # flaps are lost with the cache; the run records the gap.
      - name: Restore state from the ledger if the cache was cold
        run: |
          if [ ! -d .shadow/events ]; then
            if git fetch --depth 1 origin shadow-ledger 2>/dev/null; then
              git worktree add --detach .ledger FETCH_HEAD
              python scripts/shadow_ledger.py restore --ledger .ledger --shadow .shadow
              git worktree remove --force .ledger
            else
              echo "no ledger branch yet; starting from an empty shadow tree"
            fi
          fi

      # Exit code 2 means the source was reachable but not current (a stale
      # clock, an identical payload). That is an observation, not a failure of
      # the pipeline; anything else is.
      - name: Observe once
        run: |
          set +e
          python scripts/accessibility_shadow.py --root .shadow
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then exit "$code"; fi

      - name: Seal closed days
        if: ${{ inputs.seal }}
        run: |
          python scripts/seal_events.py \
            --events-root .shadow/events \
            --manifest-root .shadow/_manifests \
            --raw-root .shadow/raw

      - name: Rebuild aggregates
        if: ${{ inputs.seal }}
        run: |
          python scripts/build_aggregates.py \
            --events-root .shadow/events \
            --raw-root .shadow/raw \
            --aggregates-root .shadow/aggregates \
            --site-root .shadow/site

      - name: Verify the retention contract
        run: |
          python scripts/check_retention.py \
            --events-root .shadow/events \
            --manifest-root .shadow/_manifests \
            --raw-root .shadow/raw \
            --aggregates-root .shadow/aggregates

      - name: Save shadow tree
        uses: actions/cache/save@v4
        if: always()
        with:
          path: .shadow
          key: shadow-tree-${{ github.run_id }}

      - name: Note the outcome
        if: always()
        run: |
          tail -n 1 .shadow/runs.jsonl 2>/dev/null | python -c '
          import json, sys
          line = sys.stdin.read().strip()
          if line:
              row = json.loads(line)
              print(f"{row.get(\"attempted_at\")}: {row.get(\"outcome\")}, complete={row.get(\"complete\")}, "
                    f"entities={row.get(\"observed_entities\")}, transitions={row.get(\"transitions\")}, "
                    f"warnings={row.get(\"warnings\")}")
          ' >> "$GITHUB_STEP_SUMMARY" || true
