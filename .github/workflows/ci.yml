name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pytest -q
      - name: Journey model and data contracts
        run: node --test tests/test_journey_model.cjs
      - name: Static site integrity
        run: python scripts/check_site.py

      # RETENTION.md promises these as CI checks. A policy that is only written
      # down is the policy the legacy pipeline had.
      - name: Retention contract
        run: python scripts/check_retention.py
