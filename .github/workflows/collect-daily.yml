name: collect-daily
on: { workflow_dispatch: {}, schedule: [{ cron: '43 20 * * *' }] }
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r requirements.txt || true
      - name: Build daily data
        run: |
          python scripts/build_daily_summary.py
          python scripts/build_site_data.py
          python scripts/build_source_health.py
          python scripts/check_storage_size.py
      - name: Debug status
        run: |
          pwd
          git status --short
          find data -maxdepth 5 -type f || true
          find site/data -maxdepth 3 -type f || true
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p data/bronze data/silver data/gold data/manifests site/data
          git add -A data site/data
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore(data): daily aggregation"
            git push
          fi
