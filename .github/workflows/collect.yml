name: collect
on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Collect data
        run: |
          python scripts/collect_snapshot.py | tee /tmp/collect_manifest.log
          python scripts/build_daily_summary.py
          python scripts/build_site_data.py
          python scripts/build_source_health.py
      - name: Debug status
        run: |
          echo "pwd=$(pwd)"
          echo "manifest path written:"
          rg -n '"data/manifests/.+\\.json"|"run_id"' /tmp/collect_manifest.log || true
          echo "changed files under data/ and site/data:"
          git status --short data site/data || true
          echo "full git status before commit:"
          git status
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bronze data/silver data/gold data/manifests site/data
          git diff --cached --quiet || git commit -m "chore(data): update transit friction snapshots"
          git push
