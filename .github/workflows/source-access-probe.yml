name: source access probe (temporary)
on:
  push:
    branches: [claude/source-access-probe]
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch the feed and carry it out in annotations
        run: |
          ua="berlin-transit-friction/0.2 (+https://github.com/frnkptrln/berlin-transit-friction)"
          code=$(curl -sS -o /tmp/rss -D /tmp/headers -A "$ua" --max-time 25 -w '%{http_code}' https://brokenlifts.org/rss)
          echo "::notice title=rss-status::$code $(wc -c < /tmp/rss) bytes sha256=$(sha256sum /tmp/rss | cut -c1-64)"
          echo "::notice title=rss-headers::$(tr -d '\r' < /tmp/headers | grep -i -E '^(content-type|last-modified|etag|cache-control|expires|date|content-length|vary|cf-cache-status):' | tr '\n' ' ')"
          # conditional request support
          lm=$(tr -d '\r' < /tmp/headers | grep -i '^last-modified:' | cut -d' ' -f2- | head -1)
          et=$(tr -d '\r' < /tmp/headers | grep -i '^etag:' | cut -d' ' -f2- | head -1)
          [ -n "$et" ] && echo "::notice title=rss-if-none-match::$(curl -sS -o /dev/null -A "$ua" -H "If-None-Match: $et" --max-time 25 -w '%{http_code}' https://brokenlifts.org/rss)"
          [ -n "$lm" ] && echo "::notice title=rss-if-modified-since::$(curl -sS -o /dev/null -A "$ua" -H "If-Modified-Since: $lm" --max-time 25 -w '%{http_code}' https://brokenlifts.org/rss)"
          # the www host and the feed's alternates
          for u in https://www.brokenlifts.org/rss https://brokenlifts.org/feed https://brokenlifts.org/rss.xml https://brokenlifts.org/api https://brokenlifts.org/stations.json https://brokenlifts.org/robots.txt; do
            echo "::notice title=alt::$u $(curl -sS -o /tmp/alt -A "$ua" --max-time 20 -w '%{http_code} %{content_type} %{size_download}' "$u") $(head -c 160 /tmp/alt | tr '\n' ' ' | tr -d '\r')"
          done
          gzip -9 -c /tmp/rss | base64 -w0 > /tmp/rss.b64
          echo "::notice title=rss-b64-length::$(wc -c < /tmp/rss.b64)"
          split -b 3000 -d /tmp/rss.b64 /tmp/chunk.
          for f in /tmp/chunk.*; do echo "::notice title=rss-$(basename $f)::$(cat $f)"; done
