name: daily-summary
on:
  workflow_dispatch:
  schedule:
    - cron: "30 18 * * *"
concurrency:
  group: transit-data-writes
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Build artifacts
        run: |
          python scripts/build_daily_summary.py
          python scripts/build_site_data.py
          python scripts/build_source_health.py
      - name: Debug status
        run: |
          echo "pwd=$(pwd)"
          echo "manifest path written (latest known):"
          find data/manifests -type f | tail -n 1 || true
          echo "changed files under data/ and site/data:"
          git status --short data site/data || true
          echo "full git status before commit:"
          git status
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p data/bronze data/silver data/gold data/manifests site/data

          echo "Recent commits:"
          git log --oneline -3 || true

          echo "Status before pre-stage rebase:"
          git status --short
          git pull --rebase origin main || true
          echo "Status after pre-stage rebase:"
          git status --short

          git add data/gold data/manifests site/data
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi

          git commit -m "chore(summary): rebuild daily summary"

          echo "Status before push rebase:"
          git status --short
          git pull --rebase origin main
          echo "Status after push rebase:"
          git status --short

          for attempt in 1 2 3; do
            if git push origin main; then
              echo "Push succeeded on attempt ${attempt}."
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Push failed on attempt ${attempt}; rebasing and retrying..."
              git pull --rebase origin main
            fi
          done

          echo "Push failed after 3 attempts."
          exit 1
