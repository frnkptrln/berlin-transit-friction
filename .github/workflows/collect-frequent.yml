name: collect-frequent
on:
  workflow_dispatch:
  schedule: [{ cron: '7,22,37,52 * * * *' }]
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: 'pip install -r requirements.txt || true'
      - name: Collect frequent data
        run: |
          python scripts/collect_snapshot.py --frequent | tee /tmp/collect_manifest.log
          python scripts/build_source_health.py
          python scripts/check_storage_size.py
      - name: Debug status
        run: |
          pwd
          git status --short
          find data -maxdepth 5 -type f || true
          find site/data -maxdepth 3 -type f || true
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p data/bronze data/silver data/gold data/manifests site/data
          git add -A data site/data
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore(data): frequent collection"
            git push
          fi
